services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=training.settings
    volumes:
      # Код + db.sqlite3 на диске ПК (не теряются при recreate)
      - .:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput
      && exec gunicorn training.wsgi:application --bind 0.0.0.0:8000 --workers 2"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Локальный доступ без HTTPS: docker compose --profile local up
  # Открывает http://localhost:8000 напрямую к gunicorn.
  web-local:
    profiles: ["local"]
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=training.settings
      - DEBUG=1
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate --noinput
      && exec gunicorn training.wsgi:application --bind 0.0.0.0:8000"

  monitor:
    profiles: ["monitor"]
    image: python:3.12-slim
    restart: unless-stopped
    depends_on:
      - web
    environment:
      - CHECK_URL=http://web:8000/
      - CHECK_INTERVAL_SECONDS=30
      - REQUEST_TIMEOUT_SECONDS=5
      - MONITORED_SERVICE_NAME=web
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - .:/app:ro
    working_dir: /app
    command: python scripts/telegram_health_notifier.py

volumes:
  caddy_data:
  caddy_config:
